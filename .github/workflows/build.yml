name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Inspect and Build
        run: |
          echo "=== Klasör İçeriği ==="
          ls -la
          
          if [ -f "build.gradle" ] || [ -f "app/build.gradle" ]; then
            echo "Gradle projesi tespit edildi."
            gradle assembleDebug
          elif [ -d "src" ]; then
            echo "Ham Java/Android yapısı tespit edildi."
            android update project --path . || true
            ant debug || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'





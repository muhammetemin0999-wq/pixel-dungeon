name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools and Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant android-sdk openjdk-17-jdk

      - name: Build APK
        run: |
          android update project --path . || true
          ant debug || gradle build || ./gradlew build || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'
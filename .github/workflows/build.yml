name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Locate and Build Project
        run: |
          BUILD_XML=$(find . -name "build.xml" | head -n 1)
          if [ -n "$BUILD_XML" ]; then
            DIR=$(dirname "$BUILD_XML")
            echo "build.xml bulundu: $DIR"
            cd "$DIR"
            ant debug || ant release
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Derleme dosyası bulunamadı!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'




name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant android-sdk

      - name: Build APK with Ant
        run: |
          ant debug || ant release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            bin/*.apk
            **/*.apk



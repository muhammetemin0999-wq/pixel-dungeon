name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Find and Build Project
        run: |
          find . -maxdepth 3 -name "build.xml" -execdir ant debug \; || true
          find . -maxdepth 3 -name "gradlew" -execdir chmod +x gradlew \; -execdir ./gradlew assembleDebug \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/*.apk'

